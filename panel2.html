<div style="background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #ddd;">
    <h3>⚙️ Configuración del Libro y Preventa</h3>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
        <div>
            <label>Título del Libro:</label>
            <input type="text" id="cfg-titulo" placeholder="Ej: Yo antes y después de ti">
            <label>URL Imagen Portada:</label>
            <input type="text" id="cfg-portada" placeholder="URL de la imagen">
        </div>
        <div>
            <label>Estado de la venta:</label>
            <select id="cfg-estado" onchange="document.getElementById('div-amz').style.display = (this.value=='AMAZON'?'block':'none')">
                <option value="PREVENTA">Preventa Activa (Formulario)</option>
                <option value="AMAZON">Venta en Amazon (Botón comprar)</option>
                <option value="OCULTO">Ocultar libro</option>
            </select>
            <div id="div-amz" style="display:none;">
                <label>URL de Amazon:</label>
                <input type="text" id="cfg-amazon" placeholder="https://amazon.es/...">
            </div>
        </div>
    </div>
    <button onclick="guardarConfig()" style="margin-top:10px; background:#2ecc71; color:white; padding:10px; border:none; border-radius:5px; cursor:pointer;">
        Actualizar Web y Quitar/Poner Preventa
    </button>
</div>

<script>
// Función para enviar la configuración a Google
async function guardarConfig() {
    const data = {
        titulo: document.getElementById('cfg-titulo').value,
        portada: document.getElementById('cfg-portada').value,
        estado: document.getElementById('cfg-estado').value,
        amazonUrl: document.getElementById('cfg-amazon').value,
        precio: "20€"
    };
    
    const resp = await fetch(SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'upsertLibro', data: data })
    });
    const res = await resp.json();
    if(res.success) alert("¡Web actualizada!");
}
</script>
