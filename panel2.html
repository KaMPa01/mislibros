<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Pro | Ana Carolina</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #FF1493; --secondary: #34495e; --bg: #f8fafc; --white: #ffffff; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar y Layout */
        .sidebar { width: 260px; background: var(--secondary); color: white; display: flex; flex-direction: column; }
        .menu-item { padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; color: #cbd5e1; }
        .menu-item.active { background: var(--primary); color: white; }
        .main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .content { padding: 2rem; }

        /* Tarjetas y Tablas */
        .card { background: white; border-radius: 0.8rem; padding: 1.5rem; border: 1px solid var(--border); margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { text-align: left; padding: 0.8rem; border-bottom: 2px solid var(--border); color: #64748b; font-size: 0.8rem; }
        td { padding: 0.8rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        
        /* Botones y Formulario */
        .btn { padding: 0.6rem 1.2rem; border-radius: 0.4rem; border: none; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; }
        .btn-save { background: #22c55e; color: white; }
        .btn-edit { background: #3498db; color: white; padding: 0.3rem 0.6rem; font-size: 0.8rem; }
        .btn-delete { background: #e74c3c; color: white; padding: 0.3rem 0.6rem; font-size: 0.8rem; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        input, select { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 0.4rem; box-sizing: border-box; }
        
        #login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .badge { padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: bold; }
        .badge-PREVENTA { background: #fef3c7; color: #92400e; }
        .badge-AMAZON { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div style="background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 300px; text-align: center;">
            <h2 style="color: var(--primary);">Acceso Admin</h2>
            <input type="text" id="username" placeholder="Usuario" style="margin-bottom: 1rem;">
            <input type="password" id="password" placeholder="Contraseña" style="margin-bottom: 1rem;">
            <button class="btn btn-save" style="width: 100%; justify-content: center;" onclick="login()">Entrar</button>
        </div>
    </div>

    <aside class="sidebar">
        <div style="padding: 2rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1);"><h3>ANA CAROLINA</h3></div>
        <div class="menu-item active" onclick="nav('libros', this)"><i class="fas fa-book"></i> Gestión de Libros</div>
        <div class="menu-item" onclick="nav('pedidos', this)"><i class="fas fa-shopping-cart"></i> Pedidos</div>
    </aside>

    <main class="main">
        <div class="content">
            <section id="sec-libros">
                <div class="card">
                    <h3>Añadir / Editar Libro</h3>
                    <div class="form-grid">
                        <div><label>Título</label><input type="text" id="cfg-titulo"></div>
                        <div><label>Portada (URL)</label><input type="text" id="cfg-portada"></div>
                        <div><label>Estado</label>
                            <select id="cfg-estado" onchange="toggleAmz()">
                                <option value="PREVENTA">Preventa Activa</option>
                                <option value="AMAZON">Venta en Amazon</option>
                                <option value="OCULTO">Oculto</option>
                            </select>
                        </div>
                        <div id="amz-input" style="display:none;"><label>Link Amazon</label><input type="text" id="cfg-amazon"></div>
                    </div>
                    <button class="btn btn-save" onclick="guardarLibro()"><i class="fas fa-save"></i> Guardar Cambios</button>
                </div>

                <div class="card">
                    <h3>Catálogo Actual</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Portada</th>
                                <th>Título</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-libros-body"></tbody>
                    </table>
                </div>
            </section>

            <section id="sec-pedidos" style="display:none;">
                <div class="card"><h3>Lista de Pedidos</h3><table id="tabla-pedidos"><thead><tr><th>Cliente</th><th>Estado</th></tr></thead><tbody id="pedidos-body"></tbody></table></div>
            </section>
        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz3i9b6Ek6ghlzNjNkWDZJlnouhN49OCWgazcHu1u-uAHMhWOEQBlWYu8XXJS9pA1DK/exec";

        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const r = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'login', user, pass }) });
            const d = await r.json();
            if(d.success) { document.getElementById('login-overlay').style.display = 'none'; cargarCatalogo(); }
            else alert("Error de acceso");
        }

        function nav(sec, el) {
            document.querySelectorAll('section').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById('sec-' + sec).style.display = 'block';
            el.classList.add('active');
            if(sec === 'pedidos') cargarPedidos();
        }

        function toggleAmz() {
            document.getElementById('amz-input').style.display = (document.getElementById('cfg-estado').value === 'AMAZON') ? 'block' : 'none';
        }

        async function cargarCatalogo() {
            const r = await fetch(SCRIPT_URL + "?action=getAllLibros");
            const libros = await r.json();
            const body = document.getElementById('tabla-libros-body');
            body.innerHTML = "";
            libros.forEach(l => {
                body.innerHTML += `
                    <tr>
                        <td><img src="${l.portada}" style="width:40px; border-radius:4px;"></td>
                        <td><strong>${l.titulo}</strong></td>
                        <td><span class="badge badge-${l.estado}">${l.estado}</span></td>
                        <td style="display:flex; gap:5px;">
                            <button class="btn btn-edit" onclick="prepararEdicion('${l.titulo}', '${l.portada}', '${l.estado}', '${l.amazonUrl || ''}')"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-delete" onclick="eliminarLibro(${l.rowIndex})"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>`;
            });
        }

        function prepararEdicion(t, p, e, a) {
            document.getElementById('cfg-titulo').value = t;
            document.getElementById('cfg-portada').value = p;
            document.getElementById('cfg-estado').value = e;
            document.getElementById('cfg-amazon').value = a;
            toggleAmz();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function eliminarLibro(idx) {
            if(!confirm("¿Seguro que quieres eliminar este libro?")) return;
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteLibro', rowIndex: idx }) });
            cargarCatalogo();
        }

        async function guardarLibro() {
            const data = {
                titulo: document.getElementById('cfg-titulo').value,
                portada: document.getElementById('cfg-portada').value,
                estado: document.getElementById('cfg-estado').value,
                amazonUrl: document.getElementById('cfg-amazon').value
            };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'upsertLibro', data }) });
            alert("¡Web actualizada!");
            cargarCatalogo();
        }
    </script>
</body>
</html>
