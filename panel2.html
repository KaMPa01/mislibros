<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Ana Carolina</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --sidebar-width: 260px;
            --primary: #FF1493;
            --primary-dark: #C71585;
            --secondary: #34495e;
            --bg: #f8fafc;
            --white: #ffffff;
            --text-main: #1e293b;
            --border: #e2e8f0;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; display: flex; height: 100vh; overflow: hidden; }

        /* Login */
        #login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .login-card { background: var(--white); padding: 2.5rem; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 350px; text-align: center; }
        .login-card input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid var(--border); border-radius: 0.5rem; }
        .login-card button { width: 100%; padding: 0.8rem; background: var(--primary); color: white; border: none; border-radius: 0.5rem; font-weight: bold; cursor: pointer; }

        /* Sidebar */
        .sidebar { width: var(--sidebar-width); background: var(--secondary); color: white; display: flex; flex-direction: column; }
        .sidebar-header { padding: 1.5rem; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .menu-item { padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; transition: 0.2s; color: #cbd5e1; }
        .menu-item:hover, .menu-item.active { background: var(--primary); color: white; }

        /* Main Content */
        .main { flex: 1; display: flex; flex-direction: column; }
        .top-bar { height: 60px; background: white; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 2rem; justify-content: space-between; }
        .content { padding: 2rem; overflow-y: auto; }

        /* Cards */
        .card { background: white; border-radius: 0.8rem; padding: 1.5rem; border: 1px solid var(--border); margin-bottom: 1.5rem; }
        .section { display: none; }
        .section.active { display: block; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
        input, select { width: 100%; padding: 0.6rem; border: 1px solid var(--border); border-radius: 0.4rem; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th { text-align: left; padding: 1rem; border-bottom: 2px solid var(--border); font-size: 0.8rem; color: #64748b; }
        td { padding: 1rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
        
        .btn-save { background: #22c55e; color: white; border: none; padding: 0.8rem 1.5rem; border-radius: 0.5rem; cursor: pointer; font-weight: bold; margin-top: 1rem; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-card">
            <h2 style="color: var(--primary);">Admin Ana Carolina</h2>
            <input type="text" id="username" placeholder="Usuario">
            <input type="password" id="password" placeholder="Contraseña">
            <button onclick="handleLogin()">Entrar</button>
        </div>
    </div>

    <aside class="sidebar">
        <div class="sidebar-header"><h3>Panel Pro</h3></div>
        <div class="menu-item active" onclick="nav('libros', this)"><i class="fas fa-book"></i> Libros</div>
        <div class="menu-item" onclick="nav('pedidos', this)"><i class="fas fa-list"></i> Pedidos</div>
    </aside>

    <main class="main">
        <div class="top-bar">
            <h2 id="page-title">Gestión de Libros</h2>
            <button onclick="location.reload()" style="border:none; background:none; cursor:pointer; color:var(--primary); font-weight:bold;">Salir</button>
        </div>

        <div class="content">
            <section id="sec-libros" class="section active">
                <div class="card">
                    <h3>Configurar Preventa Activa</h3>
                    <div class="form-grid">
                        <div>
                            <label>Título</label>
                            <input type="text" id="cfg-titulo">
                        </div>
                        <div>
                            <label>URL Portada</label>
                            <input type="text" id="cfg-portada">
                        </div>
                        <div>
                            <label>Estado</label>
                            <select id="cfg-estado" onchange="toggleAmz()">
                                <option value="PREVENTA">Preventa Activa</option>
                                <option value="AMAZON">Venta Amazon</option>
                                <option value="OCULTO">Oculto</option>
                            </select>
                        </div>
                        <div id="amz-div" style="display:none;">
                            <label>URL Amazon</label>
                            <input type="text" id="cfg-amazon">
                        </div>
                    </div>
                    <button class="btn-save" onclick="updateLibro()">Actualizar Web</button>
                </div>
            </section>

            <section id="sec-pedidos" class="section">
                <div class="card">
                    <h3>Últimos Pedidos</h3>
                    <table>
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Método</th>
                                <th>Estado</th>
                            </tr>
                        </thead>
                        <tbody id="lista-pedidos"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbQZZYXYNi2Q4Kzp6EzjMREZ_vIa8X3JTmKKk_RZ3Fg2apVSnL-3UyOwKjawamzL8_M/exec";

        function nav(sec, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById('sec-' + sec).classList.add('active');
            el.classList.add('active');
            document.getElementById('page-title').innerText = el.innerText;
            if(sec === 'pedidos') fetchOrders();
        }

        function toggleAmz() {
            document.getElementById('amz-div').style.display = (document.getElementById('cfg-estado').value === 'AMAZON') ? 'block' : 'none';
        }

        async function handleLogin() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            try {
                const r = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'login', user, pass }) });
                const d = await r.json();
                if(d.success) {
                    document.getElementById('login-overlay').style.display = 'none';
                    loadLibro();
                } else alert("Datos incorrectos");
            } catch(e) { alert("Error de conexión"); }
        }

        async function loadLibro() {
            const r = await fetch(SCRIPT_URL + "?action=getLibroActivo");
            const l = await r.json();
            document.getElementById('cfg-titulo').value = l.titulo || "";
            document.getElementById('cfg-portada').value = l.portada || "";
            document.getElementById('cfg-estado').value = l.estado || "PREVENTA";
            document.getElementById('cfg-amazon').value = l.amazonUrl || "";
            toggleAmz();
        }

        async function updateLibro() {
            const data = {
                titulo: document.getElementById('cfg-titulo').value,
                portada: document.getElementById('cfg-portada').value,
                estado: document.getElementById('cfg-estado').value,
                amazonUrl: document.getElementById('cfg-amazon').value,
                precio: "20€"
            };
            const r = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'upsertLibro', data }) });
            const res = await r.json();
            if(res.success) alert("¡Web sincronizada!");
        }

        async function fetchOrders() {
            const list = document.getElementById('lista-pedidos');
            list.innerHTML = "Cargando...";
            const r = await fetch(SCRIPT_URL);
            const orders = await r.json();
            list.innerHTML = "";
            orders.forEach(o => {
                if(!o.nombre_y_apellido) return;
                list.innerHTML += `<tr><td>${o.nombre_y_apellido}</td><td>${o.metodo_de_envio}</td><td>${o.estado || 'Pendiente'}</td></tr>`;
            });
        }
    </script>
</body>
</html>
