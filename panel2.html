<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión - Ana Carolina</title>
    <style>
        /* Estilos base (Mantenemos los tuyos) */
        body { font-family: sans-serif; background-color: #f4f7f9; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .config-box { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 30px; border-top: 5px solid #3498db; }
        .input-group { margin-bottom: 15px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-save { background: #2ecc71; color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        /* Reutilizamos tus estilos de login y tabla del panel original... */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #f4f7f9; display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        #main-content { display: none; }
    </style>
</head>
<body>
    <div id="login-overlay">
        <div class="login-box">
            <h2>Panel Administrativo</h2>
            <input type="text" id="username" placeholder="Usuario">
            <input type="password" id="password" placeholder="Contraseña">
            <button id="login-btn" style="width:100%; background:#3498db; color:white; border:none; padding:10px; margin-top:10px; cursor:pointer;">Entrar</button>
        </div>
    </div>

    <div id="main-content" class="container">
        <h1>Gestión de la Web</h1>
        
        <div class="config-box">
            <h3>⚙️ Configuración del Libro Activo</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="input-group">
                    <label>Título del Libro:</label>
                    <input type="text" id="cfg-titulo" placeholder="Ej: Yo antes y después de ti">
                    <label>URL de la Portada:</label>
                    <input type="text" id="cfg-portada" placeholder="https://tudominio.com/imagen.jpg">
                </div>
                <div class="input-group">
                    <label>Estado de la Web:</label>
                    <select id="cfg-estado" onchange="toggleAmazon()">
                        <option value="PREVENTA">Preventa Activa (Muestra Formulario)</option>
                        <option value="AMAZON">Venta en Amazon (Quita Preventa)</option>
                        <option value="OCULTO">Ocultar Todo</option>
                    </select>
                    <div id="amazon-input-div" style="display:none;">
                        <label>URL de Amazon:</label>
                        <input type="text" id="cfg-amazon" placeholder="https://amazon.es/tu-libro">
                    </div>
                </div>
            </div>
            <button onclick="guardarWeb()" class="btn-save">Actualizar Web de Reserva</button>
        </div>

        <hr>
        <h2>Pedidos Recibidos</h2>
        <div id="loader">Cargando pedidos...</div>
        <ul id="order-list" style="list-style:none; padding:0;"></ul>
    </div>

    <script>
        const SCRIPT_URL = ""https://script.google.com/macros/s/AKfycbwt_xwMOsvvf9Gxbt1Hjodc4tf2aCVhNtuqBGEEEfK7vAOdc84-U3Qbyro0EN3WIJJs/exec";

        // Login (Igual que el tuyo)
        document.getElementById('login-btn').addEventListener('click', async () => {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const resp = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'login', user, pass }) });
            const data = await resp.json();
            if(data.success) {
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                cargarPedidos();
            } else { alert("Error de acceso"); }
        });

        function toggleAmazon() {
            const estado = document.getElementById('cfg-estado').value;
            document.getElementById('amazon-input-div').style.display = (estado === 'AMAZON') ? 'block' : 'none';
        }

        async function guardarWeb() {
            const data = {
                titulo: document.getElementById('cfg-titulo').value,
                portada: document.getElementById('cfg-portada').value,
                estado: document.getElementById('cfg-estado').value,
                amazonUrl: document.getElementById('cfg-amazon').value,
                precio: "20€"
            };
            const resp = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: 'upsertLibro', data }) });
            const res = await resp.json();
            if(res.success) alert("¡Web actualizada con éxito!");
        }

        async function cargarPedidos() {
            const resp = await fetch(SCRIPT_URL);
            const orders = await resp.json();
            const list = document.getElementById('order-list');
            document.getElementById('loader').style.display = 'none';
            orders.forEach(order => {
                const li = document.createElement('li');
                li.style.background = "white"; li.style.margin = "10px 0"; li.style.padding = "15px";
                li.innerHTML = `<strong>${order.nombre_y_apellido}</strong> - ${order.metodo_de_envio} (${order.estado || 'Pendiente'})`;
                list.appendChild(li);
            });
        }
    </script>
</body>
</html>
