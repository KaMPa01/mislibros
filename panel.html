<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Pro | Ana Carolina</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #FF1493; --secondary: #34495e; --bg: #f8fafc; --white: #ffffff; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; display: flex; height: 100vh; overflow: hidden; color: #333; }
        .sidebar { width: 260px; background: var(--secondary); color: white; display: flex; flex-direction: column; z-index: 100; }
        .menu-item { padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; color: #cbd5e1; transition: 0.2s; }
        .menu-item:hover { background: rgba(255,255,255,0.1); }
        .menu-item.active { background: var(--primary); color: white; }
        .main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .content { padding: 2rem; }
        
        .card { background: white; border-radius: 0.8rem; padding: 1.5rem; border: 1px solid var(--border); margin-bottom: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        
        table.table-libros { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        table.table-libros th { text-align: left; padding: 0.8rem; border-bottom: 2px solid var(--border); color: #64748b; font-size: 0.85rem; text-transform: uppercase; }
        table.table-libros td { padding: 0.8rem; border-bottom: 1px solid var(--border); font-size: 0.9rem; vertical-align: middle; }
        
        .btn { padding: 0.6rem 1.2rem; border-radius: 0.4rem; border: none; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 0.5rem; transition: 0.2s; font-size: 0.9rem; }
        .btn-save { background: #22c55e; color: white; }
        .btn-edit { background: #3498db; color: white; }
        .btn-delete { background: #e74c3c; color: white; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        label { display: block; font-weight: bold; font-size: 0.9rem; margin-bottom: 0.5rem; color: #475569; }
        input[type="text"], input[type="password"], select, textarea { width: 100%; padding: 0.7rem; border: 1px solid var(--border); border-radius: 0.4rem; box-sizing: border-box; font-family: inherit; }
        
        #login-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
        .badge { padding: 0.4rem 0.8rem; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-Pendiente { background: #fef3c7; color: #92400e; }
        .badge-Enviado { background: #dcfce7; color: #166534; }

        .layout-pedidos { display: flex; flex-direction: row; gap: 30px; }
        #orders-container { flex-grow: 1; }
        #filter-menu { flex-basis: 220px; flex-shrink: 0; background-color: #ffffff; border-radius: 8px; padding: 20px; height: fit-content; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        #filter-menu ul { list-style: none; padding: 0; margin: 0; }
        #filter-menu li a { display: block; padding: 10px 15px; text-decoration: none; color: #34495e; border-radius: 5px; }
        #filter-menu li a.active { background-color: #3498db; color: white; font-weight: bold; }

        .order-list { list-style: none; padding: 0; margin:0; }
        .order-item { background-color: #fff; border: 1px solid #e0e0e0; border-radius: 8px; margin-bottom: 10px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .order-item.status-enviado { background-color: #f8fff9; border-left: 5px solid #4CAF50; }
        
        .details-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: flex-start; z-index: 2000; overflow-y: auto; padding: 40px 20px; }
        .details-content { background: white; padding: 40px; width: 100%; max-width: 800px; border-radius: 8px; position:relative; }
        .info-block { background: #f9f9f9; padding: 15px; border-radius: 5px; margin-top: 10px; border: 1px solid #eee; }
        
        .bizum-link a { font-weight: bold; color: #8b5cf6; text-decoration: none; display:inline-flex; align-items:center; gap:5px; padding: 8px 15px; background: #f3e8ff; border-radius: 5px; }

        @media print {
            body > *:not(#printable-albaran) { display: none !important; }
            #printable-albaran, #printable-albaran * { display: block !important; }
        }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="card" style="width:320px; text-align:center;">
            <h2 style="color: var(--primary);">Panel Escritora</h2>
            <input type="text" id="username" placeholder="Usuario" style="margin-bottom:1rem;">
            <input type="password" id="password" placeholder="Contraseña" style="margin-bottom:1.5rem;">
            <button class="btn btn-save" style="width:100%; justify-content:center;" onclick="login()">Entrar</button>
        </div>
    </div>

    <aside class="sidebar">
        <div style="padding:2rem; text-align:center;"><h3>ANA CAROLINA</h3></div>
        <div class="menu-item active" onclick="nav('libros', this)"><i class="fas fa-book"></i> Libros</div>
        <div class="menu-item" onclick="nav('pedidos', this)"><i class="fas fa-shopping-cart"></i> Pedidos</div>
    </aside>

    <main class="main">
        <div class="content">
            <section id="sec-libros">
                <div class="card">
                    <h3>Gestión de Libros</h3>
                    <div class="form-grid">
                        <div><label>Título</label><input type="text" id="cfg-titulo"></div>
                        <div><label>Precio</label><input type="text" id="cfg-precio"></div>
                        <div style="grid-column: 1 / -1;"><label>Portada (URL)</label><input type="text" id="cfg-portada"></div>
                        <div>
                            <label>Estado</label>
                            <select id="cfg-estado">
                                <option value="PREVENTA">Preventa</option>
                                <option value="AMAZON">Amazon</option>
                                <option value="OCULTO">Oculto</option>
                            </select>
                        </div>
                        <div style="grid-column: 1 / -1;"><label>Sinopsis</label><textarea id="cfg-sinopsis" rows="4"></textarea></div>
                    </div>
                    <button class="btn btn-save" onclick="guardarLibro()">Guardar</button>
                </div>
                <div class="card">
                    <table class="table-libros">
                        <thead><tr><th>Portada</th><th>Título</th><th>Estado</th><th>Acciones</th></tr></thead>
                        <tbody id="tabla-libros-body"></tbody>
                    </table>
                </div>
            </section>

            <section id="sec-pedidos" style="display:none;">
                <div class="layout-pedidos">
                    <div id="orders-container">
                        <div class="card">
                            <h3>Listado de Pedidos</h3>
                            <ul id="order-list" class="order-list"></ul>
                        </div>
                    </div>
                    <aside id="filter-menu">
                        <h3>Filtros</h3>
                        <ul>
                            <li><a href="#" class="filter-btn active" data-filter="todos">Todos</a></li>
                            <li><a href="#" class="filter-btn" data-filter="pendiente">Pendientes</a></li>
                            <li><a href="#" class="filter-btn" data-filter="enviado">Enviados</a></li>
                        </ul>
                    </aside>
                </div>
            </section>
        </div>
    </main>

    <div id="details-overlay" class="details-overlay">
        <div class="details-content">
            <h2 style="color:var(--primary);">Detalles de la Reserva</h2>
            <div id="modal-body-content"></div>
            <div style="margin-top:30px; display:flex; gap:10px; justify-content:center;">
                <button class="btn btn-edit" onclick="window.print()">Imprimir</button>
                <button class="btn btn-delete" onclick="document.getElementById('details-overlay').style.display='none'">Cerrar</button>
            </div>
        </div>
    </div>

    <div id="printable-albaran"></div>

    <script>
        // URL de tu Script corregida según tus archivos
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-jUO7temB67OBgNhBvJ8Xx4jMRRf15tp75fGIldJlhSSJG7NnH6aBG6Sc1YiRAFCi/exec";
        let allOrders = [];

        async function login() {
            // Lógica de login similar a tus archivos previos
            document.getElementById('login-overlay').style.display = 'none';
            cargarCatalogo();
        }

        function nav(sec, el) {
            document.querySelectorAll('section').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById('sec-' + sec).style.display = 'block';
            el.classList.add('active');
            if(sec === 'pedidos') cargarPedidos();
        }

        async function cargarPedidos() {
            const list = document.getElementById('order-list');
            list.innerHTML = '<li>Cargando...</li>';
            const r = await fetch(SCRIPT_URL + "?action=getAllOrders");
            allOrders = await r.json();
            renderOrders(allOrders);
        }

        function renderOrders(orders) {
            const list = document.getElementById('order-list');
            list.innerHTML = '';
            orders.reverse().forEach(o => {
                const li = document.createElement('li');
                li.className = 'order-item' + (o["Estado"] === 'Enviado' ? ' status-enviado' : '');
                li.innerHTML = `
                    <div class="order-details">
                        <strong>${o["Nombre y apellido"]}</strong> - ${o["Metodo de envío"]}<br>
                        <small>${o["Marca temporal"]}</small>
                    </div>
                    <button class="btn btn-edit" onclick='showOrderDetails(${JSON.stringify(o)})'>Ver Detalles</button>
                `;
                list.appendChild(li);
            });
        }

        // FUNCIÓN CORREGIDA PARA MAPEAR TUS COLUMNAS LARGAS
        function showOrderDetails(order) {
            const container = document.getElementById('modal-body-content');
            
            // Mapeo dinámico de tus columnas exactas del Sheet
            container.innerHTML = `
                <div class="info-block">
                    <p><strong>Cliente:</strong> ${order["Nombre y apellido"]}</p>
                    <p><strong>Email:</strong> ${order["Correo electrónico (Obligatorio para envios correos y inpost)"]}</p>
                    <p><strong>Teléfono:</strong> ${order["Teléfono (Obligatorio para envío correos y inpost)"] || order["teléfono. 698982882"]}</p>
                </div>
                <div class="info-block">
                    <p><strong>¿Firmado?:</strong> ${order["¿Quieres firmado?"]}</p>
                    <p><strong>Dedicatoria para:</strong> ${order["Nombre para la firma."] || 'N/A'}</p>
                </div>
                <div class="info-block">
                    <p><strong>Método:</strong> ${order["Metodo de envío"]}</p>
                    <p><strong>Dirección:</strong> ${order["Para envíos por correos.\nDirección."] || order["Punto Inpost"] || 'N/A'}</p>
                    <p><strong>Población:</strong> ${order["Población (Obligatorio para envío correos y Inpost)"]} (${order["Provincia"] || ''})</p>
                    <p><strong>C.P.:</strong> ${order["código postal (Obligatorio para envío correos)"] || ''}</p>
                </div>
                <div class="info-block bizum-link">
                    <p><strong>Bizum:</strong> 
                    ${order["Pago mediante Bizum y justificante de pago\nteléfono. 698982882"] ? 
                    `<a href="${order["Pago mediante Bizum y justificante de pago\nteléfono. 698982882"]}" target="_blank">Ver Comprobante</a>` : 'No adjunto'}
                    </p>
                </div>
            `;

            // Preparar albarán imprimible
            document.getElementById('printable-albaran').innerHTML = container.innerHTML;
            document.getElementById('details-overlay').style.display = 'flex';
        }

        // Eventos de filtros
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelector('.filter-btn.active').classList.remove('active');
                e.target.classList.add('active');
                const filter = e.target.dataset.filter;
                let filtered = allOrders;
                if(filter === 'pendiente') filtered = allOrders.filter(o => o["Estado"] !== 'Enviado');
                if(filter === 'enviado') filtered = allOrders.filter(o => o["Estado"] === 'Enviado');
                renderOrders(filtered);
            });
        });

        // Funciones de libros omitidas para brevedad, pero se mantienen igual
        function cargarCatalogo() { /* ... */ }
        function guardarLibro() { /* ... */ }
    </script>
</body>
</html>
