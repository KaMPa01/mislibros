<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Ana Carolina</title>
    <style>
        /* ... (Tus estilos originales de panel.html) ... */
        .btn-edit { background: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .view-section { display: none; }
        .active-view { display: block; }
    </style>
</head>
<body>
    <div id="login-overlay">
        <div class="login-box"><h2>Acceso Panel</h2><input type="text" id="username"><input type="password" id="password"><button id="login-btn">Entrar</button></div>
    </div>

    <div id="main-content" style="display:none;">
        <div class="container">
            <div class="main-layout">
                <div id="content-area" style="flex-grow:1;">
                    
                    <section id="orders-view" class="view-section active-view">
                        <h1>Gestión de Pedidos</h1>
                        <div id="loader" class="loading">Cargando...</div>
                        <ul id="order-list" class="order-list"></ul>
                    </section>

                    <section id="books-view" class="view-section">
                        <h1>Gestión de Libros</h1>
                        <div id="books-admin-list" style="margin-bottom:30px;">
                            <h3>Libros actuales</h3>
                            <ul id="items-libros" class="order-list"></ul>
                        </div>

                        <div style="background:white; padding:20px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
                            <h3 id="form-book-title">Añadir Nuevo Libro</h3>
                            <form id="add-book-form">
                                <input type="hidden" id="book-id">
                                <input type="text" id="book-title" placeholder="Título" required style="width:100%; margin-bottom:10px; padding:8px;">
                                <textarea id="book-desc" placeholder="Sinopsis" required style="width:100%; height:80px; margin-bottom:10px; padding:8px;"></textarea>
                                <input type="number" id="book-price" placeholder="Precio Preventa (€)" required style="width:100%; margin-bottom:10px; padding:8px;">
                                <input type="url" id="book-amazon" placeholder="URL Amazon" style="width:100%; margin-bottom:10px; padding:8px;">
                                <label><input type="checkbox" id="book-preorder"> Es preventa</label>
                                <br><br>
                                <p id="cover-msg" style="display:none; font-size:0.8em; color:gray;">Sube una foto solo si quieres cambiar la actual.</p>
                                <input type="file" id="book-cover" accept="image/*">
                                <br><br>
                                <button type="submit" id="save-book-btn" style="background:#2ecc71; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">Guardar Libro</button>
                                <button type="button" id="cancel-edit-btn" style="display:none; background:#e74c3c; color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">Cancelar</button>
                            </form>
                        </div>
                    </section>
                </div>

                <aside id="filter-menu">
                    <h3>Navegación</h3>
                    <ul>
                        <li><a href="#" class="nav-link active" data-target="orders-view">📦 Pedidos</a></li>
                        <li><a href="#" class="nav-link" data-target="books-view">📚 Libros</a></li>
                    </ul>
                </aside>
            </div>
        </div>
    </div>

    <div id="details-overlay" class="details-overlay">...</div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby7-nstevoll0ZES13xlV4zOEsHf-BWrrmyUSfdxlkxdC8eFZRo9QPskXvlPiJcMeZJ/exec";

        // LOGIN Y NAVEGACIÓN
        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active-view'));
                document.getElementById(link.dataset.target).classList.add('active-view');
                if(link.dataset.target === 'books-view') loadBooksAdmin();
                else loadOrders();
            });
        });

        // --- GESTIÓN DE LIBROS (FRONTEND) ---
        async function loadBooksAdmin() {
            const list = document.getElementById('items-libros');
            list.innerHTML = '<li>Cargando...</li>';
            const res = await fetch(SCRIPT_URL + "?action=getBooks");
            const books = await res.json();
            list.innerHTML = '';
            books.forEach(b => {
                const li = document.createElement('li');
                li.className = 'order-item';
                li.innerHTML = `<div><b>${b.titulo}</b> (${b.precio}€)</div><button class="btn-edit">Editar</button>`;
                li.querySelector('button').onclick = () => prepareEditBook(b);
                list.appendChild(li);
            });
        }

        function prepareEditBook(b) {
            document.getElementById('form-book-title').textContent = "Editar: " + b.titulo;
            document.getElementById('book-id').value = b.id;
            document.getElementById('book-title').value = b.titulo;
            document.getElementById('book-desc').value = b.descripcion;
            document.getElementById('book-price').value = b.precio;
            document.getElementById('book-amazon').value = b.amazon_url;
            document.getElementById('book-preorder').checked = (b.es_preventa === true || b.es_preventa === "true");
            document.getElementById('save-book-btn').textContent = "Actualizar";
            document.getElementById('cancel-edit-btn').style.display = "inline";
            document.getElementById('cover-msg').style.display = "block";
            document.getElementById('book-cover').required = false;
        }

        document.getElementById('add-book-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('save-book-btn');
            const id = document.getElementById('book-id').value;
            btn.disabled = true; btn.textContent = 'Guardando...';

            const fileInput = document.getElementById('book-cover');
            let coverData = null;
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                coverData = await new Promise(r => {
                    reader.onload = () => r({ fileName: file.name, mimeType: file.type, base64Data: reader.result.split(',')[1] });
                    reader.readAsDataURL(file);
                });
            }

            const payload = {
                action: id ? 'updateBook' : 'addBook',
                id: id,
                titulo: document.getElementById('book-title').value,
                descripcion: document.getElementById('book-desc').value,
                precio: document.getElementById('book-price').value,
                amazon_url: document.getElementById('book-amazon').value,
                es_preventa: document.getElementById('book-preorder').checked,
                coverFile: coverData
            };

            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            const result = await res.json();
            if(result.success) { alert('Éxito'); location.reload(); }
            else { alert('Error: ' + result.message); btn.disabled = false; }
        };

        // ... (Mantén aquí el resto de tus funciones de loadOrders(), showOrderDetails(), attemptLogin(), etc.) ...
    </script>
</body>
</html>
